name: Prepare release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write
  attestations: write
  artifact-metadata: write

# Cada SHA conserva su artefacto; un nuevo merge no cancela el anterior.
concurrency:
  group: prepare-${{ github.sha }}
  cancel-in-progress: false

jobs:
  windows-x64:
    uses: ./.github/workflows/build-windows.yml
    with:
      ref: ${{ github.sha }}
  windows-arm64:
    uses: ./.github/workflows/build-windows-arm64.yml
    with:
      ref: ${{ github.sha }}
  macos:
    uses: ./.github/workflows/build-macos.yml
    with:
      ref: ${{ github.sha }}
  linux:
    uses: ./.github/workflows/build-linux.yml
    with:
      ref: ${{ github.sha }}
  verify-dry-run:
    name: Ensayo sin publicar (${{ matrix.platform }})
    needs: [windows-x64, windows-arm64, macos, linux]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-x64, windows-arm64, macos, linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: canvas-desktop-${{ matrix.platform }}
          path: dist
      - name: Validar paquetes y procedencia sin publicar
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version']
          os.environ['RELEASE_TAG'] = f'v{version}'
          if os.environ['PLATFORM'] == 'windows-x64':
              from scripts import publish_release as publish
          else:
              from scripts import publish_optional as publish
          publish.main()
          PY
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: scripts
          DRY_RUN: 'true'
          PLATFORM: ${{ matrix.platform }}
          RELEASE_SHA: ${{ github.sha }}
          SIGNER_WORKFLOW: build-${{ matrix.platform }}.yml
