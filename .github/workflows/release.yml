name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag existente que coincide con Cargo.toml (ej. v0.7.0)'
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  gate:
    name: Validar version, main y CI
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      sha: ${{ steps.validate.outputs.sha }}
      tag: ${{ steps.validate.outputs.tag }}
      prepared_run: ${{ steps.validate.outputs.prepared_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validar release
        id: validate
        run: python scripts/release_gate.py
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

  windows-x64:
    needs: gate
    if: needs.gate.outputs.prepared_run == ''
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/build-windows.yml
    with:
      ref: ${{ needs.gate.outputs.sha }}

  windows-arm64:
    uses: ./.github/workflows/build-windows-arm64.yml
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    with:
      ref: ${{ inputs.tag || github.ref_name }}
      reuse: true

  macos-dmg:
    uses: ./.github/workflows/build-macos.yml
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    with:
      ref: ${{ inputs.tag || github.ref_name }}
      reuse: true

  linux-packages:
    uses: ./.github/workflows/build-linux.yml
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    with:
      ref: ${{ inputs.tag || github.ref_name }}
      reuse: true

  release:
    name: Publicar Windows verificado
    needs: [gate, windows-x64]
    if: >-
      always() && needs.gate.result == 'success' &&
      (needs.windows-x64.result == 'success' || needs.gate.outputs.prepared_run != '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: canvas-desktop-windows-x64
          path: dist
          run-id: ${{ needs.gate.outputs.prepared_run || github.run_id }}
          github-token: ${{ github.token }}
      - run: python scripts/publish_release.py
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.gate.outputs.tag }}
          RELEASE_SHA: ${{ needs.gate.outputs.sha }}

  publish-windows-arm64:
    name: Adjuntar windows-arm64
    needs: [gate, release, windows-arm64]
    if: always() && needs.release.result == 'success' && needs.windows-arm64.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: canvas-desktop-windows-arm64
          path: dist
          run-id: ${{ needs.windows-arm64.outputs.run_id }}
          github-token: ${{ github.token }}
      - run: python scripts/publish_optional.py
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: windows-arm64
          RELEASE_TAG: ${{ needs.gate.outputs.tag }}
          RELEASE_SHA: ${{ needs.gate.outputs.sha }}
          SIGNER_WORKFLOW: build-windows-arm64.yml

  publish-macos:
    name: Adjuntar macos
    needs: [gate, release, macos-dmg]
    if: always() && needs.release.result == 'success' && needs.macos-dmg.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: canvas-desktop-macos
          path: dist
          run-id: ${{ needs.macos-dmg.outputs.run_id }}
          github-token: ${{ github.token }}
      - run: python scripts/publish_optional.py
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: macos
          RELEASE_TAG: ${{ needs.gate.outputs.tag }}
          RELEASE_SHA: ${{ needs.gate.outputs.sha }}
          SIGNER_WORKFLOW: build-macos.yml

  publish-linux:
    name: Adjuntar linux
    needs: [gate, release, linux-packages]
    if: always() && needs.release.result == 'success' && needs.linux-packages.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: canvas-desktop-linux
          path: dist
          run-id: ${{ needs.linux-packages.outputs.run_id }}
          github-token: ${{ github.token }}
      - run: python scripts/publish_optional.py
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: linux
          RELEASE_TAG: ${{ needs.gate.outputs.tag }}
          RELEASE_SHA: ${{ needs.gate.outputs.sha }}
          SIGNER_WORKFLOW: build-linux.yml
