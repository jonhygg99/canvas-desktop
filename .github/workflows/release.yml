name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# OJO: en un repo creado desde 2023 el GITHUB_TOKEN por defecto es de SOLO
# LECTURA. Sin este bloque, `action-gh-release` falla con 403 «Resource not
# accessible by integration» DESPUÉS de haber compilado y empaquetado los
# cuatro jobs. Declararlo explícitamente es lo que hace que el release exista.
permissions:
  contents: write

jobs:
  # NSIS x64: la plataforma principal (ver CLAUDE.md "Windows es el objetivo
  # primario"). Es el ÚNICO asset que hoy cumple «descargar y listo»: doble
  # clic al setup.exe y el asistente instala el .exe, registra las
  # asociaciones «Abrir con» y crea accesos directos. El job `release` exige
  # que este termine bien, así que un fallo aquí NO se publica como release.
  windows-x64:
    name: Windows NSIS (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Versión fijada a propósito: packaging/windows/installer.nsi es una
      # bifurcación de la plantilla de cargo-packager del tag v0.11.8. Si CI
      # instala «lo último» y cambian las variables Handlebars, el instalador
      # deja de compilar sin que nadie haya tocado el repo.
      - run: cargo install cargo-packager --locked --version 0.11.8
      - run: cargo build --release --locked -p canvas-app
      - run: cargo packager --release -p canvas-app --formats nsis
      # cargo-packager nombra el asset con el nombre del binario y la versión
      # del workspace (`canvas-desktop_0.1.0_x64-setup.exe`): ya viene sin
      # espacios ni mayúsculas, así que se sube tal cual y el enlace de
      # descarga queda predecible.
      - uses: actions/upload-artifact@v7
        with:
          name: canvas-desktop-windows-x64
          path: target/release/*-setup.exe

  # NSIS arm64: best-effort. Cross-compilar aarch64-pc-windows-msvc necesita
  # el componente "MSVC ARM64 build tools" en la imagen del runner; no se ha
  # podido verificar en local (falla el link.exe en un dev machine sin ese
  # componente instalado) y tampoco hay hardware ARM64 para probar el
  # instalador resultante. `continue-on-error` para que un fallo aqui no
  # bloquee el release de x64.
  windows-arm64:
    name: Windows NSIS (arm64, best-effort)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-packager --locked --version 0.11.8
      - run: cargo build --release --locked --target aarch64-pc-windows-msvc -p canvas-app
      - run: cargo packager --release --target aarch64-pc-windows-msvc -p canvas-app --formats nsis
      - uses: actions/upload-artifact@v7
        with:
          name: canvas-desktop-windows-arm64
          path: target/aarch64-pc-windows-msvc/release/*-setup.exe

  # macOS y Linux: best-effort. Ninguno de los dos es «descargar y listo»
  # todavía: el DMG va sin firmar ni notarizar (Gatekeeper obliga a
  # clic derecho > Abrir la primera vez) y el AppImage necesita chmod +x. Un
  # fallo aquí no bloquea el release, pero se publica lo que sí compile.
  macos-dmg:
    name: macOS DMG (best-effort)
    runs-on: macos-latest
    continue-on-error: true
    env:
      # Desactivable: sin certificado de firma/notarizacion no se puede
      # compilar en CI. Poner a "true" y configurar los secrets de
      # cargo-packager (APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
      # APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID) para activarlo de verdad.
      CANVAS_MACOS_SIGN: ${{ vars.CANVAS_MACOS_SIGN || 'false' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-packager --locked --version 0.11.8
      - run: cargo build --release --locked -p canvas-app
      - name: Package (unsigned unless CANVAS_MACOS_SIGN=true)
        run: cargo packager --release -p canvas-app --formats dmg
      - uses: actions/upload-artifact@v7
        with:
          name: canvas-desktop-macos
          path: target/release/*.dmg

  linux-packages:
    name: Linux AppImage/deb (best-effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # libfontconfig1-dev es obligatorio para COMPILAR: egui-winit enlaza
      # `yeslogic-fontconfig-sys`, cuyo build script falla con exit 101 sin las
      # cabeceras de fontconfig. La lista es la misma que la del job `test` de
      # ci.yml (que sí lo tenía) más fuse/libfuse2, que solo hace falta para
      # generar el AppImage.
      - name: Install Linux GUI + packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libdbus-1-dev pkg-config libgl1-mesa-dev libegl1-mesa-dev \
            libfontconfig1-dev \
            fuse libfuse2
      - run: cargo install cargo-packager --locked --version 0.11.8
      - run: cargo build --release --locked -p canvas-app
      - run: cargo packager --release -p canvas-app --formats deb,appimage
      - uses: actions/upload-artifact@v7
        with:
          name: canvas-desktop-linux
          path: |
            target/release/*.deb
            target/release/*.AppImage

  # ÚNICO publicador. Antes cada job llamaba a action-gh-release por su
  # cuenta: cuatro creadores del MISMO release en paralelo es una carrera
  # (el que pierde recibe «already_exists») y el cuerpo del release quedaba
  # indefinido. Ahora los builds solo suben artefactos y este job los baja
  # todos y publica una vez.
  release:
    name: Publicar release
    needs: [windows-x64, windows-arm64, macos-dmg, linux-packages]
    # `always()` para que un fallo best-effort (arm64/macOS/Linux) no impida
    # publicar, pero exigiendo windows-x64 en `success`: un release sin el
    # instalador de Windows no le sirve a nadie, así que es preferible que no
    # exista a que exista vacío o a medias.
    if: >-
      always()
      && startsWith(github.ref, 'refs/tags/')
      && needs['windows-x64'].result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Show assets to publish
        run: ls -l dist
      - uses: softprops/action-gh-release@v3
        with:
          name: "Canvas Desktop ${{ github.ref_name }}"
          # `body_path` primero (guía de descarga, en español) y encima el
          # changelog automático de commits que genera GitHub.
          body_path: .github/release-body.md
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: false
          files: dist/*
