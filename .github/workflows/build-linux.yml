name: Build linux package
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      reuse:
        default: false
        type: boolean
    outputs:
      run_id:
        value: ${{ jobs.select.outputs.run_id || github.run_id }}
permissions:
  contents: read
  actions: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
jobs:
  select:
    timeout-minutes: 35
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.prepared.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - id: prepared
        if: inputs.reuse
        run: python scripts/select_prepared.py linux
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    name: Linux AppImage/deb (best-effort)
    needs: select
    if: needs.select.outputs.run_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: '1.97.1'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-linux
          cache-bin: false
          cache-workspace-crates: true
      # libfontconfig1-dev es obligatorio para COMPILAR: egui-winit enlaza
      # `yeslogic-fontconfig-sys`, cuyo build script falla con exit 101 sin las
      # cabeceras de fontconfig. libasound2-dev lo exige rodio (audio de vídeo)
      # vía alsa-sys. La lista es la misma que la del job `test` de ci.yml
      # (que sí lo tenía) más fuse/libfuse2, que solo hace falta para
      # generar el AppImage.
      - name: Install Linux GUI + audio (ALSA) + packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libdbus-1-dev pkg-config libgl1-mesa-dev libegl1-mesa-dev \
            libfontconfig1-dev libasound2-dev \
            fuse libfuse2
      - name: Cache cargo-packager
        id: packager
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/cargo-packager*
          key: packager-0.11.8-${{ runner.os }}-${{ runner.arch }}
      - if: steps.packager.outputs.cache-hit != 'true'
        run: cargo install cargo-packager --locked --version 0.11.8
      - run: cargo build --release --locked -p canvas-app
      - run: cargo packager --release -p canvas-app --formats deb,appimage
      - name: Attest package
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            target/release/*.deb
            target/release/*.AppImage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          if-no-files-found: error
          name: canvas-desktop-linux
          path: |
            target/release/*.deb
            target/release/*.AppImage
