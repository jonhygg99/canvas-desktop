name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Disparador manual para el job `gpu-bake` (Actions › Run workflow):
  # sin esto, su condición `workflow_dispatch` nunca podía cumplirse (A12).
  workflow_dispatch:
    inputs:
      run_gpu:
        description: 'Ejecutar las pruebas GPU en el runner [self-hosted, gpu]'
        required: false
        default: true
        type: boolean

# Un nuevo commit del PR sustituye su CI anterior; main conserva cada SHA.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  reuse:
    name: Verificar CI equivalente del PR
    runs-on: ubuntu-latest
    outputs:
      reuse: ${{ steps.check.outputs.reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: check
        run: python scripts/ci_reuse.py
        env:
          GH_TOKEN: ${{ github.token }}

  verified-tree:
    name: Registrar arbol verificado del PR
    needs: [release-command, release-tools, fmt, test, shell-cross, msrv]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: git rev-parse 'HEAD^{tree}' > tree.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-ci-tree
          path: tree.txt
          retention-days: 30

  release-command:
    name: release command tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - shell: pwsh
        run: ./scripts/release_tests.ps1

  release-tools:
    name: release automation tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python -m unittest discover -s scripts -p '*_tests.py'
      - name: Validate GitHub Actions workflows
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=

  fmt:
    needs: reuse
    if: needs.reuse.outputs.reuse != 'true'
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: '1.97.1'
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    needs: reuse
    if: needs.reuse.outputs.reuse != 'true'
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: '1.97.1'
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-workspace-crates: true

      # eframe con las features x11+wayland, egui-winit y arboard necesitan
      # estas cabeceras de desarrollo en Linux; muda (menus nativos) es
      # Windows-only y no necesita GTK. rodio (audio de vídeo) necesita
      # además libasound2-dev (ALSA).
      - name: Install Linux GUI + audio (ALSA) dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libdbus-1-dev pkg-config libgl1-mesa-dev libegl1-mesa-dev \
            libfontconfig1-dev libasound2-dev

      # `--all-targets` compila también los examples GPU de canvas-render
      # (bake_blur, bake_filters, save_roundtrip, export_probe, text_probe):
      # deben compilar en los tres sistemas aunque no se ejecuten aquí (los
      # runners no tienen adaptador GPU real).
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --workspace --locked

      # Guardia de cobertura: el suelo está muy por debajo del total real
      # (~425 en Windows) para no fallar por tests cfg-gated por SO, pero
      # detecta borrados masivos de archivos de test.
      - name: test-count guard
        shell: bash
        run: |
          COUNT=$(cargo test --workspace -- --list 2>/dev/null | grep -c ": test$" || true)
          echo "tests listados: $COUNT"
          if [ "$COUNT" -lt 320 ]; then
            echo "::error::solo $COUNT tests listados; el suelo es 320 (¿se borraron archivos de test?)"
            exit 1
          fi

  # La shell integration se compila para los tres SO pero solo puede
  # enlazarse en el suyo: los checks cruzados (sin linker) son la única
  # forma de validar linux.rs y macos.rs desde el CI.
  shell-cross:
    needs: reuse
    if: needs.reuse.outputs.reuse != 'true'
    name: shell cross-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: '1.97.1'
          targets: x86_64-unknown-linux-gnu,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-workspace-crates: true
      - run: cargo check -p canvas-shell --target x86_64-unknown-linux-gnu --locked
      - run: cargo check -p canvas-shell --target x86_64-apple-darwin --locked

  # El `rust-version` declarado (1.92, el máximo del árbol resuelto) se
  # comprueba con esa toolchain exacta y `--locked`: el job `test` corre en
  # Rust 1.97.1 y no detectaría una incompatibilidad con el mínimo (A13).
  msrv:
    needs: reuse
    if: needs.reuse.outputs.reuse != 'true'
    name: msrv (Rust 1.92)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: '1.92'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-workspace-crates: true
      - name: Install Linux GUI + audio (ALSA) dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libdbus-1-dev pkg-config libgl1-mesa-dev libegl1-mesa-dev \
            libfontconfig1-dev libasound2-dev
      # `--all-targets` incluye dev-dependencies y examples: el suelo cubre
      # tests y utilidades GPU, no solo la librería.
      - run: cargo check --workspace --all-targets --locked

  # Los 11 tests GPU de canvas-render (tests/gpu_bake.rs) van #[ignore] en
  # el job `test`: los runners hospedados no tienen adaptador GPU real y los
  # shaders solo se pueden verificar con uno. Este job los ejecuta a demanda
  # (Actions › Run workflow, entrada `run_gpu`) en un runner propio con GPU
  # etiquetado [self-hosted, gpu]; no se dispara en push/PR, y sin ese runner
  # conectado simplemente no llega a existir. Es la pieza que el job `test`
  # no puede cubrir y que hoy solo se verifica localmente.
  gpu-bake:
    name: gpu bake (runner con GPU, a demanda)
    if: github.event_name == 'workflow_dispatch' && inputs.run_gpu
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: '1.97.1'
      # `-- --ignored` ejecuta los 11 tests GPU (omitidos en el job `test`);
      # la salida lista ejecutados vs omitidos explícitamente.
      - run: cargo test -p canvas-render --test gpu_bake --locked -- --ignored
