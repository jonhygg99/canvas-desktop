name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      # eframe con las features x11+wayland, egui-winit y arboard necesitan
      # estas cabeceras de desarrollo en Linux; muda (menus nativos) es
      # Windows-only y no necesita GTK.
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libdbus-1-dev pkg-config libgl1-mesa-dev libegl1-mesa-dev

      # `--all-targets` compila tambien los examples GPU de canvas-render
      # (bake_blur, bake_filters, save_roundtrip, export_probe, text_probe):
      # deben compilar en los tres sistemas aunque no se ejecuten aqui (los
      # runners no tienen adaptador GPU real).
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --workspace --locked

      # Guardia de cobertura: el suelo está muy por debajo del total real
      # (~425 en Windows) para no fallar por tests cfg-gated por SO, pero
      # detecta borrados masivos de archivos de test.
      - name: test-count guard
        shell: bash
        run: |
          COUNT=$(cargo test --workspace -- --list 2>/dev/null | grep -c ": test$" || true)
          echo "tests listados: $COUNT"
          if [ "$COUNT" -lt 320 ]; then
            echo "::error::solo $COUNT tests listados; el suelo es 320 (¿se borraron archivos de test?)"
            exit 1
          fi

  # La shell integration se compila para los tres SO pero solo puede
  # enlazarse en el suyo: los checks cruzados (sin linker) son la unica
  # forma de validar linux.rs y macos.rs desde el CI.
  shell-cross:
    name: shell cross-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p canvas-shell --target x86_64-unknown-linux-gnu --locked
      - run: cargo check -p canvas-shell --target x86_64-apple-darwin --locked
