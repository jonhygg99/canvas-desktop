[package]
name = "canvas-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
canvas-core = { workspace = true }
vello = { workspace = true }
parley = { workspace = true }
thiserror = { workspace = true }
# Reducción de imágenes grandes por debajo del tope del atlas de vello antes
# de subirlas a GPU (ver `blur::MAX_FX_DIM`). Misma versión que usa canvas-io.
image = { workspace = true }

[dev-dependencies]
# Solo para los ejemplos headless de verificación sin ventana.
canvas-io = { workspace = true }
pollster = "0.4"
anyhow = { workspace = true }
# Reparsear el SVG generado por canvas-io::document_to_svg en export_probe:
# la misma versión que ya usa canvas-io, así que no duplica el árbol.
resvg = { workspace = true }
# Coste CPU (sin GPU) de codificar la escena de vello: `append_document`
# corre por frame y por ventana, así que su tiempo es parte del presupuesto
# de repintado (benches/scene_build.rs).
criterion = { workspace = true }

[[bench]]
name = "scene_build"
harness = false
