[package]
name = "canvas-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "canvas-desktop"
path = "src/main.rs"

# `cargo packager` (Fase 12): empaquetado e instaladores. Rutas relativas a
# este Cargo.toml (crates/canvas-app), igual que build.rs.
[package.metadata.packager]
product-name = "Canvas Desktop"
identifier = "com.canvas-desktop.CanvasDesktop"
description = "A native Canva-like design editor."
publisher = "Canvas Desktop"
copyright = "Copyright 2026 Canvas Desktop"
category = "Graphics and Design"
binaries = [{ path = "canvas-desktop", main = true }]
icons = [
  "../../assets/windows/icon.ico",
  "../../assets/macos/icon.icns",
  "../../assets/linux/hicolor/16x16/apps/canvas-desktop.png",
  "../../assets/linux/hicolor/24x24/apps/canvas-desktop.png",
  "../../assets/linux/hicolor/32x32/apps/canvas-desktop.png",
  "../../assets/linux/hicolor/48x48/apps/canvas-desktop.png",
  "../../assets/linux/hicolor/64x64/apps/canvas-desktop.png",
  "../../assets/linux/hicolor/128x128/apps/canvas-desktop.png",
  "../../assets/linux/hicolor/256x256/apps/canvas-desktop.png",
  "../../assets/linux/hicolor/512x512/apps/canvas-desktop.png",
]

# NSIS bifurcado (ver packaging/windows/installer.nsi): delega el registro
# «Abrir con» en `canvas-desktop.exe --register-shell`/`--unregister-shell`
# en vez de duplicar las claves de `canvas-shell::windows`. `currentUser` es
# obligatorio: esas claves viven en HKCU, no HKLM.
[package.metadata.packager.nsis]
template = "../../packaging/windows/installer.nsi"
installer-mode = "currentUser"

[build-dependencies]
winresource = { workspace = true }

[dependencies]
canvas-core = { workspace = true }
canvas-render = { workspace = true }
canvas-io = { workspace = true }
canvas-shell = { workspace = true }
eframe = { workspace = true }
image = { workspace = true }
vello = { workspace = true }
rfd = { workspace = true }
rayon = { workspace = true }
directories = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
notify = { workspace = true }
arboard = { workspace = true }
trash = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
ureq = { workspace = true }
dotenvy = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Menús nativos solo en Windows (en Linux muda exige GTK: allí se usa una
# barra de menús egui como fallback).
[target.'cfg(windows)'.dependencies]
muda = { workspace = true }
raw-window-handle = { workspace = true }
# `with_msg_hook` (`paste_hook.rs`) para detectar Ctrl+V con un bitmap en el
# portapapeles, que egui-winit se traga sin emitir `Event::Paste`; y
# `GetClipboardSequenceNumber`/`GetKeyState` para lo mismo + saber cuál
# portapapeles (interno o del SO) es más reciente.
winit = { workspace = true }
windows = { workspace = true, features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_DataExchange",
  # `GetPhysicallyInstalledSystemMemory`: RAM total para el presupuesto
  # adaptativo de la baraja (deck/system.rs).
  "Win32_System_SystemInformation",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# NSEvent local monitor (paste_hook.rs): detecta Cmd+V con un bitmap en el
# portapapeles, igual que el MSG hook en Windows. objc2-app-kit 0.3 +
# block2 0.6 ya están en el árbol (arboard, rfd, eframe).
objc2 = { version = "0.6", features = ["exception"] }
objc2-app-kit = { version = "0.3", features = ["NSEvent", "block2"] }
# Pestañas nativas de macOS: `NSString` para el `tabbingIdentifier` del
# grupo de pestañas del sistema (Cmd+N abre como pestaña nativa en la barra
# de título). Misma versión que ya está en el árbol (objc2-app-kit 0.3).
objc2-foundation = "0.3"
block2 = "0.6"
# RAM total (`sysctlbyname`/`hw.memsize`) para el presupuesto adaptativo de
# la baraja: libc ya está en el árbol (winit/wgpu/objc2), sin dependencia nueva.
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
